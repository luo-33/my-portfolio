    <script>
        window.addEventListener('scroll', function() {
            const btn = document.getElementById('backToTop');
            if (window.scrollY > 400) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        });
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

    <script>
        function copyWechat() {
            const wechatId = 'l4z6x2533';
            const hint = document.getElementById('wechat-hint');
            
            // 使用 Clipboard API 复制
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    hint.textContent = '✓ 已复制';
                    hint.style.color = '#43e97b';
                    setTimeout(() => {
                        hint.textContent = '复制 →';
                        hint.style.color = '';
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(wechatId, hint);
                });
            } else {
                fallbackCopy(wechatId, hint);
            }
        }

        function fallbackCopy(text, hintElement) {
            // 兼容旧浏览器的备用方案
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                hintElement.textContent = '✓ 已复制';
                hintElement.style.color = '#43e97b';
                setTimeout(() => {
                    hintElement.textContent = '复制 →';
                    hintElement.style.color = '';
                }, 2000);
            } catch (e) {
                hintElement.textContent = '复制失败，请手动复制';
            }
            document.body.removeChild(textarea);
        }
    </script>
